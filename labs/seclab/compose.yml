# ------------------------------------------------------------------------------
# oradba-labs - seclab: default security lab, 19c EE + 26ai Free, LABPDB1 + DEMOPDB
# Contract: Oracle container pattern (E8). Storage: LAB_STORAGE=bind|volume (E9),
# the DB*_DATA / DB*_ORADATA variables are set by common/scripts/labctl.sh.
# Image, version, ports and passwords: lab.env (copy of lab.env.example)
# ------------------------------------------------------------------------------
name: oradba-labs-seclab

services:
  db19:
    image: ${DB19_IMAGE}:${DB19_VERSION}
    container_name: seclab-db19
    hostname: seclab-db19
    restart: "no"
    environment:
      # trivadis/ora_db until M2 - mapped to the Oracle container contract:
      # hooks via INSTANCE_INIT, data under /u01 (oradba-docker images: E8)
      CONTAINER: "TRUE"
      ORACLE_SID: ${DB19_SID}
      ORACLE_PDB: LABPDB1
      ORACLE_PWD: ${ORACLE_PWD}
      INSTANCE_INIT: /u01/config
      TZ: ${TZ}
      LAB_ADMIN_PWD: ${LAB_ADMIN_PWD}
      LAB_USER_PWD: ${LAB_USER_PWD}
    volumes:
      - ${DB19_DATA}:/u01${LAB_VOLOPT:-}
      - ${DB19_LOGS}:/opt/oracle/scripts/logs
      - ${LAB_SHARED}:/opt/oracle/data
      - ../../common/scripts:/opt/oracle/common/scripts:ro
      - ../../demos:/opt/oracle/demos:ro
      - ./setup/db19:/u01/config/setup:ro
      - ./startup/db19:/u01/config/startup:ro
    ports:
      - "127.0.0.1:${DB19_PORT}:1521"
    mem_limit: ${DB19_MEM}

  db26:
    image: ${DB26_IMAGE}:${DB26_VERSION}
    container_name: seclab-db26
    hostname: seclab-db26
    restart: "no"
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      ENABLE_ARCHIVELOG: "true"
      TZ: ${TZ}
      LAB_ADMIN_PWD: ${LAB_ADMIN_PWD}
      LAB_USER_PWD: ${LAB_USER_PWD}
    volumes:
      - ${DB26_ORADATA}:/opt/oracle/oradata${LAB_VOLOPT:-}
      - ${DB26_DBCONFIG}:/opt/oracle/dbconfig${LAB_VOLOPT:-}
      - ${DB26_LOGS}:/opt/oracle/scripts/logs
      - ${LAB_SHARED}:/opt/oracle/data
      - ../../common/scripts:/opt/oracle/common/scripts:ro
      - ../../demos:/opt/oracle/demos:ro
      - ./setup/db26:/opt/oracle/scripts/setup:ro
      - ./startup/db26:/opt/oracle/scripts/startup:ro
    ports:
      - "127.0.0.1:${DB26_PORT}:1521"
    mem_limit: ${DB26_MEM}

# used only with LAB_STORAGE=volume
volumes:
  db19data:
  db26oradata:
  db26dbconfig:
# --- EOF ----------------------------------------------------------------------
